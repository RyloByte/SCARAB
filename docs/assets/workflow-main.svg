<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1314" viewBox="0 0 1400 1314" role="img">
<title>SCARAB complete workflow</title>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#666"/></marker></defs>
<text x="700" y="46" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-weight="bold">SCARAB workflow</text>
<rect x="22" y="80" width="1356" height="142" rx="12" fill="#d9e5ef" stroke="#777" stroke-width="2"/>
<text x="48" y="115" font-family="Georgia,serif" font-size="25" font-weight="bold">1. Sequence and read inputs</text>
<text x="48" y="157" font-family="Georgia,serif" font-size="25">Assembly + FASTQs + optional trusted genomes</text>
<text x="48" y="195" font-family="Georgia,serif" font-size="22">One metagenome assembly; tab-separated read list; optional SAG/reference FASTAs.</text>
<path d="M700 222 V252" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="22" y="252" width="1356" height="142" rx="12" fill="#eadff0" stroke="#777" stroke-width="2"/>
<text x="48" y="287" font-family="Georgia,serif" font-size="25" font-weight="bold">2. Sequence windows and anchors</text>
<text x="48" y="329" font-family="Georgia,serif" font-size="25">Subcontigs + sourmash MinHash</text>
<text x="48" y="367" font-family="Georgia,serif" font-size="22">Length filtering and overlapping windows; trusted sequence matches where available.</text>
<path d="M700 394 V424" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="22" y="424" width="1356" height="142" rx="12" fill="#dceadb" stroke="#777" stroke-width="2"/>
<text x="48" y="459" font-family="Georgia,serif" font-size="25" font-weight="bold">3. Abundance and composition</text>
<text x="48" y="501" font-family="Georgia,serif" font-size="25">Read coverage + tetranucleotide frequencies</text>
<text x="48" y="539" font-family="Georgia,serif" font-size="22">minimap2 → SAMtools → MetaBAT depth summary; standardized feature matrices.</text>
<path d="M700 566 V596" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="22" y="596" width="1356" height="142" rx="12" fill="#f5e5cb" stroke="#777" stroke-width="2"/>
<text x="48" y="631" font-family="Georgia,serif" font-size="25" font-weight="bold">4. Parameter selection</text>
<text x="48" y="673" font-family="Georgia,serif" font-size="25">Abundance entropy and AutoOpt</text>
<text x="48" y="711" font-family="Georgia,serif" font-size="22">Bundled reference tables select algorithm defaults or calibrated parameter sets.</text>
<path d="M700 738 V768" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="22" y="768" width="1356" height="142" rx="12" fill="#e3e3ef" stroke="#777" stroke-width="2"/>
<text x="48" y="803" font-family="Georgia,serif" font-size="25" font-weight="bold">5. Recruitment and clustering</text>
<text x="48" y="845" font-family="Georgia,serif" font-size="25">UMAP, HDBSCAN, and one-class SVM</text>
<text x="48" y="883" font-family="Georgia,serif" font-size="22">De novo bins; trusted-anchor recruitment; combination/intersection of evidence.</text>
<path d="M700 910 V940" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="22" y="940" width="1356" height="142" rx="12" fill="#d6e9e7" stroke="#777" stroke-width="2"/>
<text x="48" y="975" font-family="Georgia,serif" font-size="25" font-weight="bold">6. Contig and xPG products</text>
<text x="48" y="1017" font-family="Georgia,serif" font-size="25">Original-contig FASTAs + extended partial genomes</text>
<text x="48" y="1055" font-family="Georgia,serif" font-size="22">Compile assignments; combine trusted sequence with recruits; BBTools deduplication.</text>
<path d="M700 1082 V1112" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="22" y="1112" width="1356" height="142" rx="12" fill="#eedfdc" stroke="#777" stroke-width="2"/>
<text x="48" y="1147" font-family="Georgia,serif" font-size="25" font-weight="bold">7. Review and downstream analysis</text>
<text x="48" y="1189" font-family="Georgia,serif" font-size="25">Logs, assignment tables, and FASTA outputs</text>
<text x="48" y="1227" font-family="Georgia,serif" font-size="22">Validate genome quality independently; retain input and parameter provenance.</text>
</svg>
