name: Build release candidates (no publishing)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: build-tools
          create-args: >-
            python=3.11 conda-build conda-index
            -c conda-forge
      - name: Build and test local recipe
        shell: bash -el {0}
        run: conda build conda-recipe-local --override-channels -c conda-forge -c bioconda --output-folder dist/conda
      - uses: actions/upload-artifact@v4
        with:
          name: conda-packages
          path: dist/conda/noarch/scarab-*
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t scarab:candidate .
      - name: CLI smoke test
        run: |
          docker run --rm scarab:candidate scarab info
          docker run --rm scarab:candidate scarab recruit --help
      - name: Run reviewer test in container
        run: |
          python3 scripts/prepare_reviewer.py --output "$RUNNER_TEMP/scarab-reviewer"
          cd "$RUNNER_TEMP/scarab-reviewer/demo"
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" scarab:candidate scarab recruit -m k12.gold_assembly.fasta -l read_list.txt -s SAG -o SCARAB_out -t 2
          python3 "$GITHUB_WORKSPACE/scripts/validate_reviewer.py" --dataset . --output SCARAB_out
      - run: docker save scarab:candidate | gzip > scarab-candidate.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: container-archive
          path: scarab-candidate.tar.gz
